# Draws a snake eating your contribution graph and commits the result to the
# "output" branch. The README links to that branch, so the picture refreshes
# itself every night without you touching anything.
#
# One-time setup, see GUIDE.md > "Turning on the contribution snake":
#   Settings > Actions > General > Workflow permissions > Read and write
name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"     # every night, 03:00 UTC
  workflow_dispatch:         # ...and on demand from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # palette-matched to the rest of the profile
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=ff2e97&color_dots=0d0221,3d2a63,a45cff,00e5ff,ffcc00

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
